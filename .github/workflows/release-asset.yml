name: Release Asset

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Build release app
        run: |
          xcodebuild \
            -project CryptoTicker.xcodeproj \
            -scheme CryptoTicker \
            -configuration Release \
            -destination "platform=macOS" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app
        shell: bash
        run: |
          APP_PATH="build/Release/CryptoTicker.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app not found at $APP_PATH" >&2
            exit 1
          fi

          # Generate a complete app bundle signature so Gatekeeper does not
          # treat the downloaded release artifact as structurally damaged.
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" CryptoTicker.zip

      - name: Build installer package
        shell: bash
        run: |
          APP_PATH="build/Release/CryptoTicker.app"
          PKG_ROOT="$PWD/build/pkgroot"
          COMPONENT_PLIST="$PWD/build/components.plist"
          PKG_PATH="CryptoTicker.pkg"
          PACKAGE_VERSION="${{ steps.release.outputs.tag }}"
          PACKAGE_VERSION="${PACKAGE_VERSION#v}"

          rm -rf "$PKG_ROOT" "$COMPONENT_PLIST"
          mkdir -p "$PKG_ROOT/Applications"
          ditto "$APP_PATH" "$PKG_ROOT/Applications/CryptoTicker.app"

          pkgbuild --analyze --root "$PKG_ROOT" "$COMPONENT_PLIST"
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" "$COMPONENT_PLIST"

          pkgbuild \
            --root "$PKG_ROOT" \
            --component-plist "$COMPONENT_PLIST" \
            --identifier "io.github.zhangzhangluzi.cryptoticker" \
            --version "$PACKAGE_VERSION" \
            --scripts "$PWD/.github/packaging/pkg-scripts" \
            --install-location "/" \
            --ownership recommended \
            "$PKG_PATH"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.release.outputs.tag }}" \
            --notes ""

          gh release upload "${{ steps.release.outputs.tag }}" CryptoTicker.zip CryptoTicker.pkg \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
